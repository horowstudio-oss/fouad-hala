<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#b77b83" />
  <meta name="description" content="دعوة زفاف Fouad & Hala" />
  <title>Fouad & Hala — Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Great+Vibes&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <audio id="music" loop preload="auto"></audio>
  <button class="sound" id="sound" aria-label="تشغيل أو إيقاف الموسيقى"><span class="bars"><i></i><i></i><i></i></span></button>

  <main>
    <section class="hero panel" id="top">
      <div class="ambient a1"></div><div class="ambient a2"></div>
      <div class="petals" aria-hidden="true"></div>
      <div class="hero-inner reveal">
        <p class="eyebrow">WEDDING INVITATION</p>
        <div class="crest" aria-hidden="true"><span>F</span><b>&</b><span>H</span></div>
        <p class="arabic-script" data-opening></p>
        <h1><span data-groom></span><em>&</em><span data-bride></span></h1>
        <div class="ornament"><i></i><b>❦</b><i></i></div>
        <p class="date" data-date-label></p>
        <div class="scroll-cue"><span>مرّر للأسفل</span><i></i></div>
      </div>
    </section>

    <section class="story panel">
      <div class="arch arch-one reveal">
        <div class="floral floral-tl"></div><div class="floral floral-br"></div>
        <p class="small">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيم</p>
        <h2 class="ar-names"><span data-arabic-groom></span> <b>&</b> <span data-arabic-bride></span></h2>
        <p class="copy" data-invitation></p>
        <span class="mini-rule"></span>
        <p class="whisper">ليلةٌ تبدأ بها أجمل فصول العمر</p>
      </div>
    </section>

    <section class="details panel">
      <div class="details-wrap reveal">
        <p class="eyebrow">SAVE THE DATE</p>
        <h2>موعدنا مع الفرح</h2>
        <div class="calendar-card">
          <div class="ring r1"></div><div class="ring r2"></div>
          <p data-date-label></p>
          <strong data-time></strong>
          <span data-venue></span>
          <small data-city></small>
        </div>
        <div class="countdown" id="countdown" aria-label="العد التنازلي">
          <div><strong data-days>00</strong><span>يوم</span></div>
          <div><strong data-hours>00</strong><span>ساعة</span></div>
          <div><strong data-minutes>00</strong><span>دقيقة</span></div>
          <div><strong data-seconds>00</strong><span>ثانية</span></div>
        </div>
      </div>
    </section>

    <section class="finale panel">
      <div class="curtain left"></div><div class="curtain right"></div>
      <div class="final-card reveal">
        <p class="arabic-script" data-closing></p>
        <h2><span data-groom></span><em>&</em><span data-bride></span></h2>
        <div class="wax"><span>F</span><b>&</b><span>H</span></div>
        <p class="date" data-date-label></p>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
